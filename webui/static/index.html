<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover enables edge-to-edge safe-area layout in standalone mode on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MediaVault Console</title>
  <!-- PWA manifest. iOS/iPadOS Safari only supports display:standalone (pre-resolved). -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <!-- "Add to Home Screen" meta tags. The vendor-neutral mobile-web-app-capable
       is the modern standard (Chrome warns the apple- one is deprecated); the
       apple- one is kept alongside it for back-compat with older iOS Safari. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MediaVault" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <!-- Android / Chrome theme colour (matches --bg #0b0f17) -->
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- Preload the critical first-paint ES modules (IMP-E16 D5). With no bundler,
       every `import` is its own network round-trip; without these hints the browser
       only discovers data.js / card.js / … AFTER it parses + evaluates app.js,
       forcing a request waterfall. modulepreload fetches app.js and its hottest
       static deps in PARALLEL during <head> parsing, so the graph is warm by the
       time app.js runs. Deliberately NOT preloaded: the now-lazy admin.js /
       palette.js (and the on-demand terminal.js) — they must stay off the first-
       paint path. No external preconnect either: posters + detail are same-origin
       (/api/…), and TMDB images are fetched server-side, so a cross-origin
       preconnect would buy nothing. Paths are relative to this file (siblings). -->
  <link rel="modulepreload" href="./app.js" />
  <link rel="modulepreload" href="./data.js" />
  <link rel="modulepreload" href="./card.js" />
  <link rel="modulepreload" href="./title.js" />
  <link rel="modulepreload" href="./auth.js" />
  <link rel="modulepreload" href="./sort.js" />

  <!-- Fail-loud guard (runs BEFORE the module scripts below). This is a plain,
       dependency-free, NON-module inline script so it always executes even if the
       ES-module graph fails to evaluate. If a top-level module/script error or an
       unhandled promise rejection fires, it reveals a fixed diagnostic banner
       instead of leaving the user on a silent blank page (the failure mode the
       no-cache header now prevents, but this is the visible safety net if a
       module ever fails to load again). XSS-safe: the message is set via
       textContent only. -->
  <script>
    (function () {
      var shown = false;
      function showFailBanner(detail) {
        if (shown) return; // first error wins; don't stack banners
        shown = true;
        try {
          var bar = document.createElement("div");
          bar.id = "mv-load-error";
          bar.setAttribute("role", "alert");
          // Inline styles so the banner shows even if styles.css was the file
          // that failed to load. High z-index, fixed to the top, readable.
          bar.style.cssText =
            "position:fixed;top:0;left:0;right:0;z-index:99999;" +
            "background:#7f1d1d;color:#fff;font:14px/1.4 system-ui,sans-serif;" +
            "padding:10px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.4)";
          bar.textContent =
            "⚠️ UI failed to load (try a hard refresh / pull-to-refresh). " +
            (detail || "");
          // Body may not exist yet if the error fires very early; fall back to
          // documentElement so the banner still attaches.
          (document.body || document.documentElement).appendChild(bar);
        } catch (e) {
          /* never let the error handler throw */
        }
      }
      window.addEventListener("error", function (e) {
        // Only treat genuine script/module load+eval errors as fatal here. A
        // failed <img>/<link> resource also fires 'error' (no e.message) — ignore
        // those so a missing poster never trips the banner.
        if (e && (e.message || e.error)) {
          showFailBanner(String(e.message || (e.error && e.error.message) || ""));
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e && e.reason;
        var msg = reason && (reason.message || reason);
        showFailBanner(msg ? String(msg) : "");
      });
    })();
  </script>
</head>
<body>
  <!-- Persistent server-side DEMO/SAFE-mode banner (IMP-E14). Hidden by default;
       app.js fetches /api/mode on load and unhides this (adds .show) ONLY when the
       server reports demo:true. Sticks above the header so it stays visible while
       scrolling, on desktop and mobile. Static text only — no user data, XSS-safe. -->
  <div class="demo-banner" id="demo-banner" role="status" aria-live="polite" hidden>
    🟡 DEMO MODE — actions are simulated. Nothing real runs.
  </div>

  <header class="app-header">
    <div class="hero">
      <div class="brand">
        <div class="logo">MV</div>
        <div>
          <h1>MediaVault Console</h1>
          <p class="sub">Media Library Operations</p>
        </div>
      </div>
      <div class="reclaim-stat">
        <div class="label">Reclaimable</div>
        <div class="value empty" id="reclaim-total">—</div>
        <div class="count" id="reclaim-count"></div>
      </div>
    </div>

    <!-- Primary media-type tabs. -->
    <div class="tabbar-row">
      <div class="tabbar" id="tabbar" role="tablist"
           aria-label="Media type"></div>
      <span class="spacer"></span>
      <button type="button" class="btn-sort" id="btn-sort" title="Run library sort">
        <span aria-hidden="true">⇅</span> Sort library
      </button>
    </div>
  </header>

  <main>
    <!-- Cinematic parallax hero strip (IMP-E16 D4). A wide backdrop band opening
         each media-type tab on its most characteristic content — archived/backdrop
         titles with a Ken-Burns drift, scroll parallax, and crossfading rotation.
         Built + owned by hero.js (wired from app.js init). Starts hidden; hero.js
         unhides it only when the active tab has something to feature, and collapses
         it again when it doesn't. It sits in normal flow ABOVE #panel, so it never
         carries #panel's view-transition-name (no morph flicker on tab switch). -->
    <section id="hero" class="hero-strip" hidden></section>

    <!-- View toggle: Grouped (on-disk folder hierarchy) vs Decluttered (the flat
         by-state grid). Mirrors the #sortbar pattern; built + wired in app.js. The
         choice persists in sessionStorage and applies within each media-type tab. -->
    <div class="viewbar" id="viewbar" aria-label="View mode"></div>

    <!-- Secondary segmented sub-view rail (one sub-view shown at a time). -->
    <div class="subnav" id="subnav" role="tablist"
         aria-label="Disk-state sub-view"></div>

    <!-- Sort control: key (Size/Title/Year) + direction toggle. Client-side;
         re-orders the loaded grid instantly. Built + wired in app.js. -->
    <div class="sortbar" id="sortbar" aria-label="Sort items"></div>

    <p class="status-line" id="status-line" role="status" aria-live="polite"></p>

    <!-- The single grid for the selected (tab, sub-view). -->
    <section class="panel" id="panel" role="tabpanel" tabindex="0"></section>

    <div class="job-panel" id="sort-job-panel" style="margin-top:18px"></div>
  </main>

  <!-- Shared destructive-confirm modal for `replace`. -->
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true"
       aria-labelledby="modal-title" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="warn-icon" aria-hidden="true">!</div>
        <h2 id="modal-title">Confirm replace</h2>
      </div>
      <div class="modal-body">
        <p class="warn-line">This deletes the original after verifying the cloud upload.</p>
        <div class="target" id="modal-target"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="modal-cancel">Cancel</button>
        <button type="button" class="confirm" id="modal-confirm">Delete original</button>
      </div>
    </div>
  </div>

  <!-- Hidden card template cloned per item. The .poster is the slot Phase 5
       fills with a real image; for now it holds the gradient + initial.
       The .fetch-ring overlay (IMP-E14 Phase 2, Candidate B) is an inline SVG
       rounded-rect whose stroke-dashoffset shrinks 0->100% as fetch chunks
       complete. It sits above the poster but is pointer-events:none so the
       Fetch & Restore button stays clickable. Hidden until a fetch starts. -->
  <template id="card-tpl">
    <article class="card">
      <svg class="fetch-ring" aria-hidden="true" focusable="false"
           preserveAspectRatio="none" hidden>
        <path class="fetch-ring-track" fill="none" vector-effect="non-scaling-stroke" />
        <path class="fetch-ring-fill" fill="none" vector-effect="non-scaling-stroke"
              stroke-linecap="round" />
      </svg>
      <div class="poster">
        <span class="initial"></span>
        <span class="badge"><span class="dot"></span><span class="badge-label"></span></span>
      </div>
      <div class="card-body">
        <div class="id-row">
          <span class="item-title"></span>
          <span class="item-size"></span>
        </div>
        <div class="item-path"></div>

        <div class="field field-cmd">
          <span class="field-label">Suggested command</span>
          <div class="field-row">
            <code class="code-box cmd-text"></code>
            <button type="button" class="copy-btn cmd-copy" title="Copy command">⧉</button>
          </div>
        </div>

        <div class="field field-folder">
          <span class="field-label">Suggested folder</span>
          <div class="field-row">
            <input type="text" class="provider-input folder-input" spellcheck="false" />
            <button type="button" class="copy-btn folder-copy" title="Copy folder">⧉</button>
          </div>
          <span class="field-note folder-note"></span>
        </div>

        <div class="card-actions"></div>

        <div class="job-panel item-job"></div>

        <!-- Raw canonical id, visually subordinate (small, dim, monospace) at the
             card foot. The prominent title is .item-title at the top. -->
        <div class="item-rawid"></div>
      </div>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
  <!-- Ambient animated background canvas (self-injecting module, built separately).
       Loaded once here; it self-injects its own <canvas> + <style> and honors
       prefers-reduced-motion. This is the single load hook for that module. -->
  <script type="module" src="./background.js"></script>
</body>
</html>
